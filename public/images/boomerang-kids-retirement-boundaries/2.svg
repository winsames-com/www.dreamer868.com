  <circle cx="180" cy="329" r="68" fill="#FFFFFF" stroke="#3D6BB5" stroke-width="2"/>
  <path class="icon" d="M130 341h100 M143 341l9 35h56l9-35 M154 341l10-45h42l10 45"/>
  <path class="accent" d="M178 296v45 M164 316h28"/>
  <text class="label" x="180" y="429" text-anchor="middle">生活費增加</text>
  <line x1="105" y1="448" x2="255" y2="448" stroke="#D1482A" stroke-width="3"/>
  <text class="note" x="180" y="478" text-anchor="middle">日常採買與水電等</text>
  <text class="note" x="180" y="501" text-anchor="middle">持續增加的家庭支出</text>

  <rect x="345" y="228" width="270" height="314" rx="18" fill="#F4F4F4" stroke="#003A93" stroke-width="3"/>
  <circle cx="480" cy="329" r="68" fill="#FFFFFF" stroke="#3D6BB5" stroke-width="2"/>
  <rect class="icon" x="438" y="286" width="60" height="82" rx="5"/>
  <line class="icon" x1="451" y1="305" x2="485" y2="305"/>
  <line class="icon" x1="451" y1="320" x2="478" y2="320"/>
  <path class="accent" d="M491 355h32 M513 345l10 10-10 10"/>
  <circle cx="462" cy="345" r="9" fill="none" stroke="#D1482A" stroke-width="4"/>
  <text class="label" x="480" y="429" text-anchor="middle">代墊債務或房租</text>
  <line x1="405" y1="448" x2="555" y2="448" stroke="#D1482A" stroke-width="3"/>
