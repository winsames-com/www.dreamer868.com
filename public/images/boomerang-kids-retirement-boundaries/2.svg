  <rect x="645" y="228" width="270" height="314" rx="18" fill="#F4F4F4" stroke="#003A93" stroke-width="3"/>
  <circle cx="780" cy="329" r="68" fill="#FFFFFF" stroke="#3D6BB5" stroke-width="2"/>
  <path class="icon" d="M730 325l50-39 50 39 M741 318v52h78v-52 M771 370v-31h18v31"/>
  <circle cx="820" cy="295" r="17" fill="#FFFFFF" stroke="#D1482A" stroke-width="4"/>
  <path class="accent" d="M820 285v20 M812 291h16"/>
  <text class="label" x="780" y="429" text-anchor="middle">協助購屋頭期款</text>
  <line x1="705" y1="448" x2="855" y2="448" stroke="#D1482A" stroke-width="3"/>
