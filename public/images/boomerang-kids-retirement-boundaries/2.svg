<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">退休規劃容易遺漏的三類家庭支援</title>
  <desc id="desc">三張並列卡片分別呈現生活費增加、代墊債務或房租，以及協助購屋頭期款。</desc>
  <style>
    text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
    .heading{fill:#003A93;font-size:30px;font-weight:700}
    .context{fill:#1F1F1F;font-size:17px;font-weight:700}
    .label{fill:#003A93;font-size:21px;font-weight:700}
    .note{fill:#6B7280;font-size:15px}
    .icon{fill:none;stroke:#003A93;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .accent{fill:none;stroke:#D1482A;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <rect width="960" height="600" fill="#FFFFFF"/>
  <text class="heading" x="480" y="55" text-anchor="middle">退休規劃容易遺漏的家庭支援</text>
  <line x1="345" y1="73" x2="615" y2="73" stroke="#D1482A" stroke-width="4"/>

  <rect x="340" y="96" width="280" height="98" rx="16" fill="#F4F4F4" stroke="#3D6BB5" stroke-width="2"/>
  <path class="icon" d="M405 149h38v24h-38z M411 149v-12a13 13 0 0 1 26 0v12"/>
  <path class="accent" d="M424 132v-13 M416 124h16"/>
