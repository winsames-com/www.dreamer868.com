name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://www.dreamer868.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sitemap and verify all URLs
        run: |
          # Pages CDN 對「剛出現的新網址」不是一次就位的。原本 sleep 15 一次定生死，
          # 2026-08-21 的 CBAM 那篇就是這樣被判死（同一批網址事後全部 200）。
          # 改成：先等一段，非 200 的網址再複驗幾輪，連續幾輪都不行才算真的壞。
          echo "等待 Pages CDN 傳播..."
          sleep 30

          echo "Fetching sitemap index..."
          SITEMAPS=$(curl -sf "$SITE_URL/sitemap-index.xml" \
            | grep -oP '(?<=<loc>)[^<]+')

          URLS=""
          for sm in $SITEMAPS; do
            echo "Fetching $sm ..."
            URLS="$URLS $(curl -sf "$sm" | grep -oP '(?<=<loc>)[^<]+')"
          done

          # 🔴 這裡不准用 curl -f。-f 會讓 curl 在 4xx 直接以 exit 22 收場，而這個
          # step 跑在 `bash -e` 下——第一個非 200 的網址就把整個 step 殺掉，底下
          # 收集失敗清單、印出「Failed URLs」的邏輯永遠跑不到。2026-08-21 的 log
          # 就只剩一行 exit code 22，沒有任何網址資訊，Slack 只好亂猜失敗原因。
          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1" || echo 000; }

          TOTAL=0
          PENDING=""
          for u in $URLS; do
            TOTAL=$((TOTAL + 1))
            CODE=$(probe "$u")
            if [ "$CODE" != "200" ]; then
              echo "  ? $CODE $u"
              PENDING="$PENDING $u"
            fi
          done

          # 複驗：只重打第一輪失敗的，最多 3 輪、每輪間隔 30 秒。
          ROUND=0
          while [ -n "$PENDING" ] && [ "$ROUND" -lt 3 ]; do
            ROUND=$((ROUND + 1))
            echo ""
            echo "第 $ROUND 輪複驗（$(echo $PENDING | wc -w) 個網址）..."
            sleep 30
            STILL=""
            for u in $PENDING; do
              CODE=$(probe "$u")
              if [ "$CODE" != "200" ]; then
                echo "  ✗ $CODE $u"
                STILL="$STILL $u"
              else
                echo "  ✓ 200 $u（第 $ROUND 輪補上，屬 CDN 傳播延遲）"
              fi
            done
            PENDING="$STILL"
          done

          FAILED=$(echo $PENDING | wc -w)

          echo ""
          echo "===== Verification Result ====="
          echo "Total URLs: $TOTAL"
          echo "Failed: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "Failed URLs（複驗 $ROUND 輪後仍非 200）:"
            for u in $PENDING; do echo "  ✗ $(probe "$u") $u"; done
            exit 1
          fi
          echo "All URLs returned 200 ✓"

  indexnow:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Submit changed URLs to IndexNow
        # 金鑰本就公開託管於 /<key>.txt，非機密，可直接寫在此
        env:
          INDEXNOW_KEY: c5a3697eb65d33f5f4c44efd86d879fb
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="${AFTER}~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- 'src/content/articles/*.md' 'src/pages/' || true)
          echo "Changed content files:"; echo "$CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "No content/page changes; skipping IndexNow."
            exit 0
          fi
          node scripts/indexnow-submit.mjs $CHANGED

  notify-failure:
    needs: [build, deploy, verify, indexnow]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "Slack secrets not set; skip notify."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 哪一關垮的要講出來。原本不分關卡一律寫「請修正設計規範/建置錯誤」，
          # 2026-08-21 掛掉的其實是 verify（線上網址複驗），訊息把人指向錯的地方。
          BUILD_R="${{ needs.build.result }}"
          DEPLOY_R="${{ needs.deploy.result }}"
          VERIFY_R="${{ needs.verify.result }}"
          INDEXNOW_R="${{ needs.indexnow.result }}"
          if [ "$BUILD_R" = "failure" ]; then
            STAGE="建置（build）"; HINT="設計規範守門或 astro build 沒過，先在本機跑 pnpm build 複現"
          elif [ "$DEPLOY_R" = "failure" ]; then
            STAGE="部署（deploy）"; HINT="GitHub Pages 部署本身失敗，內容沒問題，通常重跑即可"
          elif [ "$VERIFY_R" = "failure" ]; then
            STAGE="線上複驗（verify）"; HINT="sitemap 裡有網址複驗多輪後仍非 200，log 末尾列出是哪幾個"
          elif [ "$INDEXNOW_R" = "failure" ]; then
            STAGE="IndexNow 推送"; HINT="站已經上線了，只有搜尋引擎通知沒送出"
          else
            STAGE="未知關卡"; HINT="看 run log"
          fi
          TEXT="🚨 ${{ github.repository }} 卡在 *${STAGE}* （commit ${GITHUB_SHA::7}）。${HINT}。詳情： $RUN_URL"
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            -d "$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg t "$TEXT" '{channel:$ch,text:$t}')"
